name: Normalize Troy location copy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/normalize-troy-location.yml

permissions:
  contents: write

jobs:
  normalize-location:
    if: github.event.head_commit.message != 'Normalize Troy location copy'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Normalize location wording
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          roots = [Path("src"), Path("content"), Path("scripts")]
          allowed_suffixes = {".astro", ".json", ".js", ".mjs", ".ts", ".md"}

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in allowed_suffixes:
                      continue
                  original = path.read_text(encoding="utf-8")
                  updated = re.sub(r"\bTroy,\s*NY\b", "Troy, New York", original)
                  updated = re.sub(r"\bTroy\b(?!,\s*New York)", "Troy, New York", updated)
                  if updated != original:
                      path.write_text(updated, encoding="utf-8")
                      print(f"Updated {path}")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate site
        run: |
          npm run verify:content
          npm run test:voice
          npm run verify:voice
          npm run check
          npm run build
          npm run verify:build

      - name: Commit normalized wording
        run: |
          rm .github/workflows/normalize-troy-location.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src content scripts .github/workflows/normalize-troy-location.yml
          git commit -m "Normalize Troy location copy"
          git push
