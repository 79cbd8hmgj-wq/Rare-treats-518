name: Bootstrap Rare Treats website foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [foundation/website-foundation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'foundation/website-foundation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/website-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Restore website foundation
        shell: bash
        run: |
          cat .bootstrap/part-*.txt | tr -d '\n' | base64 --decode > /tmp/rare-treats-foundation.tar.gz
          tar -xzf /tmp/rare-treats-foundation.tar.gz -C "$GITHUB_WORKSPACE"
          python - <<'PY'
          from pathlib import Path
          path = Path('src/data/content.ts')
          content = path.read_text()
          content = content.replace(
              'export const treats = treatsData as typeof treatsData & { categories: TreatCategory[] };',
              'export const treats = treatsData as unknown as Omit<typeof treatsData, "categories"> & { categories: TreatCategory[] };'
          )
          path.write_text(content)
          PY
      - name: Generate lockfile and validate
        run: |
          npm install --package-lock-only
          npm ci
          npm run verify:content
          npm run check
          npm run build
          npm run verify:build
      - name: Commit completed foundation
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Rare Treats 518 website foundation"
          git push origin HEAD:foundation/website-foundation
