name: Bootstrap Rare Treats foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [foundation/initial-site]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'foundation/initial-site')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/initial-site
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Restore website foundation
        shell: bash
        run: |
          cat .bootstrap/part-*.txt | tr -d '\n' | base64 --decode > /tmp/rare-treats-foundation.tar.gz
          tar -xzf /tmp/rare-treats-foundation.tar.gz -C "$GITHUB_WORKSPACE"
      - name: Generate lockfile and validate
        run: |
          npm install --package-lock-only
          npm ci
          npm run verify:content
          npm run check
          npm run build
      - name: Commit foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build Rare Treats 518 website foundation"
          git push origin HEAD:foundation/initial-site
