name: Apply human copy and layout patch

on:
  push:
    branches: [refine/human-copy-and-layout-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/human-copy-and-layout-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Apply patch
        run: python3 .bootstrap/apply-human-copy.py
      - name: Validate implementation
        run: |
          npm ci
          npm run verify:content
          npm run test:voice
          npm run verify:voice
          npm run check
          npm run build
          npm run verify:build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json content src scripts
          git commit -m "refine Rare Treats copy and responsive layout"
          git push origin HEAD:refine/human-copy-and-layout-audit
